<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>چت بات اکسپرت</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <style>
      #chatbox {
        position: fixed;
        bottom: 80px;
        right: 20px;
        width: 320px;
        max-height: 450px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        display: none;
        flex-direction: column;
        z-index: 9999;
      }
      .chat-messages {
        padding: 10px;
        overflow-y: auto;
        height: 300px;
      }
      .chat-input {
        padding: 10px;
      }
      #chatToggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <button id="chatToggle" class="btn btn-primary rounded-pill shadow">
      چت بات
    </button>

    <div id="chatbox" class="d-flex flex-column">
      <div class="bg-primary text-white p-2 rounded-top">پشتیبانی آنلاین</div>
      <div
        class="chat-messages border border-top-0 flex-grow-1"
        id="chatMessages"
      ></div>
      <div class="chat-input border border-top-0">
        <div class="input-group">
          <input
            type="text"
            id="userMessage"
            class="form-control"
            placeholder="پیام خود را بنویسید..."
          />
          <button class="btn btn-success" onclick="sendMessage()">ارسال</button>
        </div>
      </div>
    </div>

    <script>
      const toggleBtn = document.getElementById("chatToggle");
      const chatbox = document.getElementById("chatbox");
      const userInput = document.getElementById("userMessage");
      const messages = document.getElementById("chatMessages");

      toggleBtn.onclick = () => {
        chatbox.style.display =
          chatbox.style.display === "none" ? "flex" : "none";
      };

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        userInput.value = "";

        const res = await fetch("chat-api.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: text }),
        });

        if (!res.ok) {
          addMessage("Connect Server Error : ", "bot");
          return;
        }

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          addMessage("Response Problem ", "bot");
          return;
        }

        const reply =
          data.choices?.[0]?.message?.content || "Not Recive Data !";
        addMessage(reply, "bot");
      }

      function addMessage(msg, sender) {
        const div = document.createElement("div");
        div.className = `chat-message mb-2 p-2 rounded ${
          sender === "user" ? "bg-light text-end" : "bg-secondary text-white"
        }`;
        div.innerText = msg;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
    </script>
  </body>
</html>
